# Every day: dump our three schemas from Supabase, encrypt the dump, keep it
# as a workflow artifact for 30 days. Supabase's free plan has no backups.
# Running every day also counts as database activity, so the free project
# isn't paused for being idle a week.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    the Session pooler connection string (same as DATABASE_URL on Render)
#   BACKUP_PASSPHRASE  any long random text; you need it to restore (see deploy/README.md)
name: Backup database

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 in Bangkok
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          for name in SUPABASE_DB_URL BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing (Settings → Secrets and variables → Actions → Secrets tab, not Variables)"
              missing=1
            fi
          done
          exit $missing
      - name: Dump tb_auth, tb_tracker, tb_docs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql() { docker run --rm -e SUPABASE_DB_URL postgres:17-alpine sh -c "psql \"\$SUPABASE_DB_URL\" -tAc \"$1\""; }

          # pg_dump refuses a server newer than itself, so use the server's major version.
          version=$(psql "show server_version_num") || {
            echo "::error::Could not connect with SUPABASE_DB_URL. Use the Session pooler string, with [YOUR-PASSWORD] replaced (URL-encode @ : / ? # in it)."
            exit 1
          }
          major=$((version / 10000))
          echo "Postgres server $version → pg_dump from postgres:$major"

          schemas=$(psql "select count(*) from pg_namespace where nspname in ('tb_auth','tb_tracker','tb_docs')")
          if [ "$schemas" != "3" ]; then
            echo "::error::Found $schemas of the 3 schemas (tb_auth, tb_tracker, tb_docs). Deploy the Render service first: it creates them on start."
            exit 1
          fi

          docker run --rm -e SUPABASE_DB_URL "postgres:$major-alpine" \
            sh -c 'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
                   --schema=tb_auth --schema=tb_tracker --schema=tb_docs' > tb.dump
          ls -l tb.dump
          test -s tb.dump
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_PASSPHRASE" -o tb.dump.gpg tb.dump
          rm tb.dump
      - uses: actions/upload-artifact@v4
        with:
          name: tb-backup-${{ github.run_number }}
          path: tb.dump.gpg
          retention-days: 30
