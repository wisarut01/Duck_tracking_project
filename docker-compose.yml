# Local dev stack.
#   make up       → everything: postgres :5432, auth/tracker/docs services (gRPC :50051-50053),
#                   api-gateway :8080, Swagger UI :8081, web :5173, Storybook :6006
#   make up-api   → only the backend (postgres, services, gateway) + Swagger UI
#   make up-mock  → the old Phase 1 setup: mock-api :4010 instead of the real backend,
#                   web pointed at it. mock-api is behind the "mock" profile.
#   make down     → stop everything (the postgres volume, i.e. the data, is kept)

services:
  # --- mock backend (Phase 1), only with `--profile mock` ---
  mock-api:
    profiles: ["mock"]
    build: ./services/mock-api
    ports:
      - "4010:4010"
    volumes:
      - ./api:/spec:ro          # the mock validates requests against this file
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:6006,http://localhost:8081
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4010/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    ports:
      - "8081:8080"
    volumes:
      - ./api:/spec:ro
    environment:
      SWAGGER_JSON: /spec/openapi.yaml   # "Try it out" uses the spec's servers list (gateway :8080 first)
      PERSIST_AUTHORIZATION: "true"      # keep the Bearer token after a page reload

  # --- frontend (dev servers, hot reload from ./web) ---
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    image: tracking-board-web-dev
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - ./api:/api:ro                # npm run gen:api reads ../api/openapi.yaml
      - web_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"    # file watching through the bind mount
      # The browser calls this, so it's a host URL. `make up-mock` sets it to the mock (:4010).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}

  storybook:
    build:                           # same image as `web` (the 2nd build is a cache hit)
      context: ./web
      dockerfile: Dockerfile.dev
    image: tracking-board-web-dev
    ports:
      - "6006:6006"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: ["npx", "storybook", "dev", "-p", "6006", "--host", "0.0.0.0", "--ci"]

  # --- real backend: one Postgres instance, one database per service ---
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tb
      POSTGRES_PASSWORD: tb
      POSTGRES_DB: tb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # auth_db, tracker_db, docs_db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tb"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: { context: ., dockerfile: services/go.Dockerfile, args: { SERVICE: auth-service } }
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgres://tb:tb@postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-do-not-use-in-prod}
      SEED_DEMO_DATA: "true"   # duck / mint / ploy, password123
    depends_on:
      postgres: { condition: service_healthy }

  tracker-service:
    build: { context: ., dockerfile: services/go.Dockerfile, args: { SERVICE: tracker-service } }
    ports:
      - "50052:50052"
    environment:
      DATABASE_URL: postgres://tb:tb@postgres:5432/tracker_db?sslmode=disable
      SEED_DEMO_DATA: "true"   # project TB with TB-1..TB-12
    depends_on:
      postgres: { condition: service_healthy }

  docs-service:
    build: { context: ., dockerfile: services/docs-service/Dockerfile }
    ports:
      - "50053:50053"
    environment:
      DATABASE_URL: postgresql+psycopg://tb:tb@postgres:5432/docs_db
      SEED_DEMO_DATA: "true"   # spaces ENG and PM with their pages
    depends_on:
      postgres: { condition: service_healthy }

  api-gateway:
    build: { context: ., dockerfile: services/go.Dockerfile, args: { SERVICE: api-gateway } }
    ports:
      - "8080:8080"
    environment:
      AUTH_ADDR: auth-service:50051
      TRACKER_ADDR: tracker-service:50052
      DOCS_ADDR: docs-service:50053
      CORS_ORIGINS: http://localhost:5173,http://localhost:6006,http://localhost:8081
    depends_on:
      - auth-service
      - tracker-service
      - docs-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]  # not localhost: that is ::1 in alpine
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  web_node_modules:
